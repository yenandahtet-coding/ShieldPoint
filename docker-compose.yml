version: '3.8'

services:
  # -------------------------------------
  # Kafka & Zookeeper (Message Broker)
  # -------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------------------
  # Logger Service Database (PostgreSQL)
  # -------------------------------------
  logger-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nova_user
      POSTGRES_PASSWORD: nova_password
      POSTGRES_DB: nova_logger
    ports:
      - "5432:5432"
    volumes:
      - logger_db_data:/var/lib/postgresql/data

  # -------------------------------------
  # Fraud Service Database (MongoDB)
  # -------------------------------------
  fraud-db:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: nova_user
      MONGO_INITDB_ROOT_PASSWORD: nova_password
      MONGO_INITDB_DATABASE: nova_fraud
    ports:
      - "27017:27017"
    volumes:
      - fraud_db_data:/data/db

volumes:
  logger_db_data:
  fraud_db_data:
